plugins:
  - rubocop-rspec

AllCops:
  DisplayCopNames: true
  TargetRubyVersion: 4.0
  NewCops: enable

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/LineLength:
  IgnoreCopDirectives: true
  Max: 120

Style/ClassAndModuleChildren:
  Exclude:
    - 'app/controllers/**/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'Gemfile'
    - 'Rakefile'
    - 'spec/**/*.rb'

Style/BlockDelimiters:
  Exclude:
    - 'spec/**/*'

Naming/MethodParameterName:
  MinNameLength: 2
