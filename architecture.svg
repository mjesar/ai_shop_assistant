<svg width="680" height="588" viewBox="0 0 680 588" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Architecture diagram: how RubyLLM and the Shopify Catalog API work together</title>
<desc>A browser sends a message to the Rails app, which enqueues a background job. The job calls RubyLLM with Gemini, which decides whether to search products via the Shopify Catalog API over MCP, then generates a reply that is broadcast live back to the browser via Turbo Streams.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="210" y="40" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser</text>
<line x1="340" y1="84" x2="340" y2="144" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="144" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Rails background job</text>
<text x="340" y="182" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">ChatResponseJob (Solid Queue)</text>
<line x1="340" y1="200" x2="205" y2="260" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="95" y="260" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="205" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">RubyLLM + Gemini</text>
<text x="205" y="298" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Decides if search is needed</text>

<line x1="315" y1="276" x2="375" y2="276" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="375" y1="300" x2="315" y2="300" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="375" y="260" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Shopify Catalog API</text>
<text x="480" y="298" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Live product search (MCP)</text>

<line x1="205" y1="316" x2="340" y2="376" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="376" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Turbo Stream broadcast</text>
<text x="340" y="414" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Via Solid Cable, cross-process</text>
<line x1="340" y1="432" x2="340" y2="492" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="492" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="512" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser</text>
<text x="340" y="530" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Sees the reply instantly</text>
</svg>
